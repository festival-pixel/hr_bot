services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Только localhost: бот в docker-сети ходит в базу по имени "postgres",
    # а этот проброс нужен лишь для локального доступа/отладки с хоста.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: hr_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Внутри docker-сети бот ходит в базу по имени сервиса, а не localhost
      DB_HOST: postgres
      DB_PORT: 5432

volumes:
  postgres_data:
